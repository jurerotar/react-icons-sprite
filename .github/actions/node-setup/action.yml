runs:
  using: "composite"
  steps:
    - name: Use Node.js LTS
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 'lts/*'
        package-manager-cache: false

    - name: Install modules
      shell: bash
      run: npm ci --prefer-offline --no-audit --no-fund
