runs:
  using: "composite"
  steps:
    - name: Use Node.js LTS
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 'lts/*'
        package-manager-cache: false

    - name: Install library dependencies
      shell: bash
      # CI dependencies are explicit; optional icon peers belong to consuming apps.
      run: npm ci --workspace react-icons-sprite --legacy-peer-deps --prefer-offline --no-audit --no-fund
