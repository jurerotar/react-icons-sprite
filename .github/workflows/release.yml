name: release

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup environment (node + install)
        uses: ./.github/actions/node-setup

      - name: Build package
        run: npm run build --workspace react-icons-sprite

      - name: Resolve npm dist tag
        id: npm-tag
        run: |
          version="$(node -p "require('./packages/react-icons-sprite/package.json').version")"
          prerelease="${version#*-}"
          if [ "$prerelease" = "$version" ]; then
            tag="latest"
          elif [[ "$prerelease" =~ ^rc[0-9]*([.-].*)?$ ]]; then
            tag="rc"
          else
            tag="${prerelease%%[.-]*}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing react-icons-sprite@$version with npm dist-tag '$tag'"

      - name: Publish package with provenance
        run: npm publish --workspace react-icons-sprite --access public --tag "${{ steps.npm-tag.outputs.tag }}"
